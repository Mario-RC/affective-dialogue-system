[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "affective-dialogue-system"
version = "0.1.0"
description = "A modular affective dialogue system with ASR, emotion classification, dialogue generation, interest scoring, and TTS."
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [
  {name = "Mario Rodriguez"}
]
keywords = ["dialogue", "emotion", "speech", "transformers", "tts", "asr"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
ml = [
  "accelerate>=0.30",
  "huggingface-hub>=0.23",
  "safetensors>=0.4",
  "sentencepiece>=0.2",
  "torch>=2.1",
  "transformers>=4.45,<5",
]
asr = [
  "affective-dialogue-system[ml]",
]
tts = [
  "TTS>=0.22,<0.23",
]
safety = [
  "affective-dialogue-system[ml]",
  "detoxify>=0.5",
]
dev = [
  "pytest>=8,<10",
  "build>=1,<2",
  "ruff>=0.11,<0.17",
]
all = ["affective-dialogue-system[ml,asr,tts,safety]"]

[project.scripts]
affective-dialogue = "affective_dialogue_system.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"affective_dialogue_system.safety" = ["data/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["local"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
